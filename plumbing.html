<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive DWV Plumbing Layout Simulation</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background-color: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h2 { margin-top: 0; margin-bottom: 5px; color: #38bdf8; text-align: center; }
  p.subtitle { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 20px; text-align: center; }
  
  .container {
    background-color: #1e293b;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    max-width: 900px;
    width: 100%;
  }

  .canvas-container {
    position: relative;
    width: 100%;
    background-color: #020617;
    border: 2px solid #334155;
    border-radius: 8px;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Grid lines */
  .grid-line { stroke: #1e293b; stroke-width: 1; }
  .grid-line-major { stroke: #334155; stroke-width: 1.5; }

  /* Pipe styling */
  .pipe-main { stroke: #e11d48; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .pipe-trunk { stroke: #f97316; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .pipe-branch { stroke: #eab308; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .pipe-vent { stroke: #38bdf8; stroke-width: 3; stroke-dasharray: 6 4; stroke-linecap: round; fill: none; }

  /* Interactive Elements */
  .fixture-node {
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .fixture-node:hover circle {
    r: 14;
    filter: drop-shadow(0 0 8px #38bdf8);
  }
  
  /* Flow Animation */
  .flow-particle {
    fill: #22c55e;
    animation: flowAnim 2s infinite linear;
    opacity: 0;
  }
  
  .active-flow {
    opacity: 1;
  }

  .dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .card {
    background-color: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
  }

  .card-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .card-value { font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 5px; }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
  }

  button {
    background-color: #0284c7;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  button:hover { background-color: #0369a1; }
  button.reset { background-color: #475569; }
  button.reset:hover { background-color: #334155; }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 15px;
    font-size: 12px;
    color: #cbd5e1;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 16px; height: 4px; border-radius: 2px; }
</style>
</head>
<body>

<div class="container">
  <h2>Interactive DWV Pipe Network & Main Line Feed</h2>
  <p class="subtitle">Click on any fixture to toggle drain flow & simulate system load</p>

  <div class="canvas-container">
    <svg viewBox="0 0 800 500" id="plumbingSvg">
      <!-- Grid Background -->
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
        <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
          <rect width="200" height="200" fill="url(#grid)"/>
          <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.5"/>
        </pattern>
      </defs>
      <rect width="800" height="500" fill="url(#grid-major)" />

      <!-- PIPES LAYOUT -->
      <!-- Outdoor Main Feed line (4" CO) -->
      <path class="pipe-main" d="M 50,450 L 180,320" />
      <text x="60" y="420" fill="#f43f5e" font-size="12" font-weight="bold">4" Outdoor Cleanout (CO)</text>

      <!-- Main 3" Trunk Lines -->
      <path class="pipe-trunk" d="M 180,320 L 320,320 L 680,320" />
      <path class="pipe-trunk" d="M 320,320 L 420,220 L 420,120" />
      
      <!-- 2" Branch Lines -->
      <path class="pipe-branch" id="branch-ks" d="M 650,320 L 650,400" />
      <path class="pipe-branch" id="branch-wb" d="M 500,320 L 500,400" />
      <path class="pipe-branch" id="branch-lav" d="M 400,320 L 400,400" />
      <path class="pipe-branch" id="branch-wc" d="M 380,220 L 420,220" />
      <path class="pipe-branch" id="branch-ts" d="M 420,120 L 520,120" />

      <!-- Vent Lines (1.5" & 3" VTR Roof) -->
      <path class="pipe-vent" d="M 650,400 L 650,80 L 680,80" />
      <path class="pipe-vent" d="M 500,400 L 500,80 L 680,80" />
      <path class="pipe-vent" d="M 400,400 L 400,80 L 680,80" />
      <path class="pipe-vent" d="M 520,120 L 520,80 L 680,80" />
      <path class="pipe-vent" d="M 680,80 L 680,40" />
      <text x="685" y="45" fill="#38bdf8" font-size="11" font-weight="bold">3" VTR (Roof Stack)</text>

      <!-- Dynamic Flow Markers -->
      <g id="flowGroup"></g>

      <!-- FIXTURE NODES (Interactive) -->
      
      <!-- Kitchen Sink (KS) -->
      <g class="fixture-node" onclick="toggleFixture('ks')">
        <circle id="node-ks" cx="650" cy="400" r="10" fill="#64748b" stroke="#f8fafc" stroke-width="2"/>
        <text x="650" y="430" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Kitchen Sink (KS)</text>
        <text x="650" y="445" fill="#94a3b8" font-size="10" text-anchor="middle">2" Line / 1.5" Vent</text>
      </g>

      <!-- Washer Box (WB) -->
      <g class="fixture-node" onclick="toggleFixture('wb')">
        <circle id="node-wb" cx="500" cy="400" r="10" fill="#64748b" stroke="#f8fafc" stroke-width="2"/>
        <text x="500" y="430" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Washer Box (WB)</text>
        <text x="500" y="445" fill="#94a3b8" font-size="10" text-anchor="middle">2" Line / 1.5" Vent</text>
      </g>

      <!-- Lavatory Sink (LAV) -->
      <g class="fixture-node" onclick="toggleFixture('lav')">
        <circle id="node-lav" cx="400" cy="400" r="10" fill="#64748b" stroke="#f8fafc" stroke-width="2"/>
        <text x="400" y="430" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Lavatory (LAV)</text>
        <text x="400" y="445" fill="#94a3b8" font-size="10" text-anchor="middle">1.5" Line / Vent</text>
      </g>

      <!-- Water Closet (WC) -->
      <g class="fixture-node" onclick="toggleFixture('wc')">
        <circle id="node-wc" cx="370" cy="220" r="12" fill="#64748b" stroke="#f8fafc" stroke-width="2"/>
        <text x="310" y="225" fill="#f8fafc" font-size="12" text-anchor="end" font-weight="bold">Water Closet (WC)</text>
        <text x="310" y="240" fill="#94a3b8" font-size="10" text-anchor="end">3" Direct Branch</text>
      </g>

      <!-- Tub / Shower (TS) -->
      <g class="fixture-node" onclick="toggleFixture('ts')">
        <circle id="node-ts" cx="530" cy="120" r="10" fill="#64748b" stroke="#f8fafc" stroke-width="2"/>
        <text x="545" y="115" fill="#f8fafc" font-size="12" font-weight="bold">Tub / Shower (TS)</text>
        <text x="545" y="130" fill="#94a3b8" font-size="10">1.5" Line / Vent</text>
      </g>

    </svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background:#e11d48;"></div> 4" Outdoor Feed Line</div>
    <div class="legend-item"><div class="legend-color" style="background:#f97316;"></div> 3" Main Trunk</div>
    <div class="legend-item"><div class="legend-color" style="background:#eab308;"></div> 1.5" - 2" Branch Drain</div>
    <div class="legend-item"><div class="legend-color" style="background:#38bdf8; border-top: 1px dashed #38bdf8;"></div> Vent Thru Roof (VTR)</div>
  </div>

  <div class="dashboard">
    <div class="card">
      <div class="card-title">Active Fixtures</div>
      <div class="card-value" id="activeCount">0 / 5</div>
    </div>
    <div class="card">
      <div class="card-title">Total Drainage Load</div>
      <div class="card-value" id="dfuValue">0 DFU</div>
    </div>
    <div class="card">
      <div class="card-title">Main Outflow Rate</div>
      <div class="card-value" id="flowRate">0.0 GPM</div>
    </div>
    <div class="card">
      <div class="card-title">Main Line Status</div>
      <div class="card-value" id="mainStatus" style="color: #22c55e;">Clear</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="toggleAll(true)">Activate All Fixtures</button>
    <button class="reset" onclick="toggleAll(false)">Reset / Turn Off All</button>
  </div>
</div>

<script>
  const fixtures = {
    ks: { name: "Kitchen Sink", active: false, dfu: 2, gpm: 7.5, color: "#22c55e" },
    wb: { name: "Washer Box", active: false, dfu: 2, gpm: 10.0, color: "#22c55e" },
    lav: { name: "Lavatory Sink", active: false, dfu: 1, gpm: 5.0, color: "#22c55e" },
    wc: { name: "Water Closet", active: false, dfu: 3, gpm: 15.0, color: "#22c55e" },
    ts: { name: "Tub / Shower", active: false, dfu: 2, gpm: 8.0, color: "#22c55e" }
  };

  function toggleFixture(id) {
    fixtures[id].active = !fixtures[id].active;
    updateUI();
  }

  function toggleAll(status) {
    Object.keys(fixtures).forEach(key => {
      fixtures[key].active = status;
    });
    updateUI();
  }

  function updateUI() {
    let activeCount = 0;
    let totalDfu = 0;
    let totalGpm = 0;

    Object.keys(fixtures).forEach(id => {
      const fix = fixtures[id];
      const node = document.getElementById(`node-${id}`);
      
      if (fix.active) {
        activeCount++;
        totalDfu += fix.dfu;
        totalGpm += fix.gpm;
        node.setAttribute('fill', '#22c55e');
      } else {
        node.setAttribute('fill', '#64748b');
      }
    });

    document.getElementById('activeCount').innerText = `${activeCount} / 5`;
    document.getElementById('dfuValue').innerText = `${totalDfu} DFU`;
    document.getElementById('flowRate').innerText = `${totalGpm.toFixed(1)} GPM`;

    const statusElem = document.getElementById('mainStatus');
    if (totalDfu === 0) {
      statusElem.innerText = "Idle";
      statusElem.style.color = "#94a3b8";
    } else if (totalDfu <= 6) {
      statusElem.innerText = "Normal Flow";
      statusElem.style.color = "#22c55e";
    } else {
      statusElem.innerText = "High Flow";
      statusElem.style.color = "#f59e0b";
    }
  }
</script>

</body>
</html>
